<!DOCTYPE html>
<head>  
    <title>Rock Paper Scissors</title>
</head>
<body>
  <style>
  body{
    background: black;
    color:white;
    font-family:Arial, Helvetica, sans-serif;
    font-size: 15px;
    font-style: bold;
   
    margin-top: 70px;
  }
  .moves{     
      background-color: transparent;
      border-radius: 100%;
      border-style: solid;
      border-color: white;
      padding: 30px 30px;    
    }
     .btn{
      height: 50px;
    }
    .result{
      font-size: 25px;
      font-weight:600px;
      
    }
    .g{
      font-size:15px;
    }
    .scores{
      font-size: 18px;
    }
    .Reset-btn{
      padding:10px 15px ;
      font-size: 18px;
    }
   
  </style>
    <h1 class="p">Rock Paper Scissors</h1>    
    <button class="moves" onclick="
     ComputerGuess();
    playermove('rock');results() ;guesses();
    "><img class="btn" src="rock-emoji.png"></button>
    <button class="moves"
    onclick=" 
     ComputerGuess();
     playermove('paper'); results() ;guesses();
    "><img class="btn" src="paper-emoji.png"></button>
    <button class="moves"
     onclick=" 
     ComputerGuess();
    playermove('scissors');results();guesses(); "
    > <img class="btn" src="scissors-emoji.png"></button>
    <h2 class="result"></h2>
    <p class="g"></p>
    <p class="scores"></p>
    <button class="Reset-btn" onclick="
     Total.Wins=0;
     Total.Loses=0,
    Total.Tie=0 ; 
    localStorage.removeItem('Total');
    scores();
    ">Reset Score</button>
   
      <script>
      //  scores();
     let Total=JSON.parse(localStorage.getItem('Total'))||{
      Wins:0,
      Loses:0,
      Tie:0
     }; ; 
     scores();   
       let pick;
       let userpick;
        let result;
         function ComputerGuess(){        
           const randomnumber=Math.random();
           if(randomnumber>0 && randomnumber<1/3){
          pick='rock'; 
        }
       else if(randomnumber>=1/3 && randomnumber<2/3){
       pick='paper';
        }
        else if(randomnumber>=2/3 && randomnumber<1)
        {
        pick='scissors';  
       }
      }
      function playermove(picked){
         userpick=picked;
        if(picked==='rock'){
             if(pick=='rock'){
        result='Tie';
        }
        else if(pick=='paper'){
        result='You lose';
        }
       else{
        result='You win';
      }

      }
      else if(picked==='paper'){
        if(pick=='rock'){
        result='You win';
        }
       else if(pick==='paper'){
        result='Tie';
        }
       else{
        result='You lose';
       } 
      }
      else if(picked==='scissors'){
       if(pick=='rock'){
        result='You lose';
       }
       else if(pick=='paper'){
        result='You win';
       }
       else{
        result='Tie';
        }
      }   
      if(result=='You win'){
          Total.Wins = Total.Wins + 1;
      }
      else if(result =='You lose'){
       Total.Loses = Total.Loses + 1;
      }
      else if(result =='Tie'){
         Total.Tie = Total.Tie + 1;
      }   
   //   alert(`you picked: ${picked}.computer picked: ${pick}.${ result} Totalwins:${ Total.Wins},TotalLoses:${Total.Loses},TotalTie:${Total.Tie}`);
    localStorage.setItem("Total",JSON.stringify(Total));
    scores();
    }
    function results(){
   document.querySelector('.result').innerHTML=`${result}.`;
    }  
     function guesses(){
      document.querySelector('.g').innerHTML=(`You Picked:${userpick} - Computerpicked: ${pick}`);
     }
     function guesses(){
      document.querySelector('.g').innerHTML=(`You <img class="btn" src="${userpick}-emoji.png">  <img class="btn" src="${pick}-emoji.png">Computerpicked`);
     }
     function scores(){
      document.querySelector('.scores').innerHTML=`Wins: ${ Total.Wins},Loses: ${ Total.Loses},Ties: ${ Total.Tie}`;
     }
    </script>
        
   
    
</body>
</html>
